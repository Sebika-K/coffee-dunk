<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Coffee</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/result.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/nav-pill.css') }}"
    />
  </head>
  <body class="results-page">
    <div class="navbar">
      <form action="/results" method="GET" class="location-group">
        <input
          class="city-box"
          id="city-input"
          name="city"
          type="text"
          value="{{ city|capitalize }}"
          placeholder="Enter city"
        />
        <input
          type="number"
          class="radius-box"
          name="radius"
          value="{{ radius }}"
          placeholder="Custom Radius"
        />

        <button class="icon-button" type="submit">🔍</button>
      </form>
    </div>

    <div class="gallery">
      {% for cafe in cafes %}
      <a
        href="/cafe/{{ cafe.place_id }}?name={{ cafe.name | urlencode }}"
        class="card-link"
      >
        <div class="cafe-card">
          <img src="{{ cafe.image_url }}" alt="coffee pic" />
          <p class="cafe-name" title="{{ cafe.name }}">{{ cafe.name }}</p>
          <p class="cafe-rating">{{ cafe.rating }} ⭐</p>
        </div>
      </a>

      {% endfor %}
    </div>
    {% include "partials/nav_pill.html" %}
    <script type="module" src="/static/js/nav-pill.js"></script>
    <script type="module" src="/static/js/firebase-init.js"></script>
  </body>
</html>
