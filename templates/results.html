<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Coffee</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/result.css') }}"
    />
  </head>
  <body class="results-page">
    <div class="navbar">
      <div class="location-group">
        <input
          class="city-box"
          id="city-input"
          type="text"
          value="{{ city|capitalize }}"
          placeholder="Enter city"
        />
        <button class="icon-button" onclick="searchCity()">🔍</button>
      </div>

      <input type="number" class="radius-box" placeholder="Custom Radius" />
    </div>

    <div class="gallery">
      {% for cafe in cafes %}
      <a href="/cafe/{{ cafe.name | urlencode }}" class="card-link">
        <div class="cafe-card">
          <img src="{{ cafe.image_url }}" alt="coffee pic" />
          <p class="cafe-name">{{ cafe.name }}</p>
          <p class="cafe-rating">{{ cafe.rating }} ⭐</p>
        </div>
      </a>

      {% endfor %}
    </div>
    <script type="module" src="/static/js/firebase-init.js"></script>
  </body>
</html>
