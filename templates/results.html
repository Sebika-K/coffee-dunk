<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Coffee</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/result.css') }}"
    />
  </head>
  <body class="results-page">
    <h2>Coffee in {{ city|capitalize }}</h2>

    <div class="gallery">
      {% for cafe in cafes %}
      <div class="cafe-card">
        <img src="{{ cafe.image_url }}" alt="coffee pic" />
        <p class="cafe-name">{{ cafe.name }}</p>
        <p class="cafe-rating">{{ cafe.rating }} ⭐</p>
      </div>
      {% endfor %}
    </div>
  </body>
</html>
