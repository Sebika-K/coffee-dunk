<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Coffee</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/search.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/nav-pill.css') }}"
    />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <meta name="theme-color" content="#7D2E4D" />
  </head>
  <body class="search-page">
    <div class="search-container">
      <form action="/results" method="GET" class="search-bar">
        <input type="text" name="city" placeholder="Enter the city name" />
        <button type="submit">Search</button>
      </form>
    </div>
    {% include "partials/nav_pill.html" %}
    <script type="module" src="/static/js/nav-pill.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .catch((err) => console.error("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
