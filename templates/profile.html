<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Coffee Dump</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/profile.css') }}"
    />
  </head>
  <body class="profile-page">
    <div class="top-bar">
      <span class="username">{{ username or 'Sebikas coffee diary' }}</span>
      <a class="menu-btn" href="/settings">☰</a>
    </div>
    <div class="profile-header">
      <div class="profile-pic">
        <img
          id="profilePic"
          src="/static/assets/default-avatar.jpg"
          alt="Profile Picture"
        />
      </div>
      <input
        id="avatarInput"
        type="file"
        accept="image/*"
        style="display: none"
      />
      <button id="changeAvatarBtn" type="button">Change photo</button>

      <div class="stats">
        <div class="stat">
          <span class="number" id="postCount">0</span>
          <span class="label">POSTS</span>
        </div>
        <div class="stat">
          <span class="number" id="scoreCount">0</span>
          <span class="label">SCORE</span>
        </div>
      </div>
    </div>

    <p class="bio">Just my regular dose of supplement.</p>

    <div class="posts-grid" id="postsGrid"></div>
    <button class="add-post-btn" type="button" onclick="handleAddPost()">
      +
    </button>
    <script>
      function handleAddPost() {
        window.location.href = "/upload";
      }
    </script>
    <script type="module" src="/static/js/firebase-init.js"></script>
    <script type="module" src="/static/js/profile.js"></script>
  </body>
</html>
