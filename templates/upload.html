<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Post</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/upload.css') }}"
    />
  </head>
  <body class="upload-page">
    <div class="upload-container">
      <h2>Upload a Post</h2>

      <form id="uploadForm">
        <!-- Cafe selector -->
        <div id="cafeSelect">
          <label for="cafeQuery"><strong>Select café</strong></label>
          <div style="display: flex; gap: 8px; margin-top: 6px">
            <input
              id="cafeQuery"
              type="text"
              placeholder="Search cafés (e.g., 'Mozart Austin')"
              style="flex: 1; padding: 10px"
            />
            <button id="cafeSearchBtn" type="button">Search</button>
          </div>

          <!-- Results list will be filled by JS -->
          <ul
            id="cafeResults"
            style="list-style: none; padding-left: 0; margin-top: 8px"
          ></ul>

          <!-- Show chosen cafe -->
          <div id="cafeChosen" style="display: none; margin-top: 8px">
            <span id="cafeChosenName" style="font-weight: 600"></span>
            <button id="clearCafe" type="button" style="margin-left: 8px">
              ✕
            </button>
          </div>

          <!-- Hidden fields we’ll set after user picks a result -->
          <input type="hidden" id="placeIdInput" value="" />
          <input type="hidden" id="cafeNameInput" value="" />
        </div>
        <!-- Image picker -->
        <input type="file" accept="image/*" id="imageInput" required />

        <!-- Preview -->
        <img
          id="imagePreview"
          style="display: none; max-width: 100%; margin-top: 10px"
        />

        <!-- Caption -->
        <textarea
          id="captionInput"
          placeholder="Write a caption..."
          required
        ></textarea>

        <!-- Rating -->
        <label for="ratingInput">Rating (1-5):</label>
        <input type="number" id="ratingInput" min="1" max="5" required />

        <!-- Hidden place_id from query param
        <input type="hidden" id="placeIdInput" value="{{ place_id }}" />  -->

        <button type="submit">Post</button>
      </form>
    </div>

    <script type="module" src="/static/js/firebase-init.js"></script>
    <script type="module" src="/static/js/upload.js"></script>
  </body>
</html>
