<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Post</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/upload.css') }}"
    />
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <meta name="theme-color" content="#7D2E4D" />
  </head>
  <body class="upload-page">
    <a class="back-btn" href="/profile">←</a>
    <div class="post-header">
      <h2>Upload a Post</h2>
    </div>
    <div class="upload-container">
      <div id="photoStage" class="photo-stage">
        <img id="imagePreview" alt="Preview" />
        <button
          type="button"
          id="pickFromGallery"
          class="icon-btn gallery"
          aria-label="Pick from gallery"
        >
          🖼️
        </button>
        <button
          type="button"
          id="clearPhoto"
          class="icon-btn trash"
          aria-label="Remove photo"
        >
          🗑
        </button>
      </div>

      <!-- Hidden file input (triggers camera/gallery) -->
      <input
        type="file"
        accept="image/*"
        capture="environment"
        id="imageInput"
        style="display: none"
      />

      <form id="uploadForm">
        <!-- Cafe selector -->
        <div id="cafeSelect">
          <label for="cafeQuery"><strong>Select cafe</strong></label>
          <div class="cafe-row">
            <input id="cafeQuery" type="text" placeholder="Search cafés" />
            <button id="cafeSearchBtn" type="button">Search</button>
          </div>

          <!-- Results list will be filled by JS -->
          <ul
            id="cafeResults"
            style="list-style: none; padding-left: 0; margin-top: 8px"
          ></ul>

          <!-- Show chosen cafe -->
          <div id="cafeChosen" style="display: none; margin-top: 8px">
            <span id="cafeChosenName" style="font-weight: 600"></span>
            <button id="clearCafe" type="button" style="margin-left: 8px">
              ✕
            </button>
          </div>

          <!-- Hidden fields we’ll set after user picks a result -->
          <input type="hidden" id="placeIdInput" value="" />
          <input type="hidden" id="cafeNameInput" value="" />
        </div>

        <!-- Caption -->
        <textarea
          id="captionInput"
          placeholder="Write a caption..."
          required
        ></textarea>

        <!-- Rating -->
        <label for="ratingInput">Rating (1-5):</label>
        <input type="number" id="ratingInput" min="1" max="5" required />

        <button type="submit" disabled>Post</button>
      </form>
    </div>

    <script type="module" src="/static/js/firebase-init.js"></script>
    <script type="module" src="/static/js/upload.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .catch((err) => console.error("SW registration failed:", err));
        });
      }
    </script>
  </body>
</html>
